<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>CISC3003 Practice 08</title>
        <link href="css" rel="stylesheet" type="text/css">
        <link href="css(1)" rel="stylesheet" type="text/css">
        <link rel="stylesheet" href="styles.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    </head>    
    <body class="tiled">
    <header>
        <h1>Art Filters</h1>
    </header>
    <main>
        <div id="sliderBox">
            <form>
               <label>Opacity: </label><p><input type="range" id="sliderOpacity" min="0" max="100" value="100" class="sliders"> <span id="numOpacity">100</span>%</p>
               <p><label>Saturation: </label><input type="range" id="sliderSaturation" min="1" max="300" value="100" class="sliders"> <span id="numSaturation">100</span>%</p>
               <p><label>Brightness: </label><input type="range" id="sliderBrightness" min="0" max="300" value="100" class="sliders"> <span id="numBrightness">100</span>%</p>
               <p><label>Hue Rotate: </label><input type="range" id="sliderHue" min="0" max="360" value="0" class="sliders"> <span id="numHue">0</span>deg</p>
               <p><label>Grayscale: </label><input type="range" id="sliderGray" min="0" max="100" value="0" class="sliders"> <span id="numGray">0</span>%</p>
               <p><label>Blur: </label><input type="range" id="sliderBlur" min="0" max="10" value="0" class="sliders"> <span id="numBlur">0</span>px</p>
               <p><button id="resetFilters">Reset</button> </p>
            </form>    
        </div>
        <figure id="imgManipulated">
            <img src="./images/medium/painting1.jpg"> 
            <figcaption>
                <em>Still Life with Flowers in a Glass Vase</em> <br>
                Jan Davidsz. de Heem, 1650 - 1683
            </figcaption>
        </figure>   
        <div id="thumbBox">
            <div><img src="./images/small/painting1.jpg" alt="Still Life with Flowers in a Glass Vase" title="Jan Davidsz. de Heem, 1650 - 1683"></div>
            <div><img src="./images/small/painting2.jpg" alt="Portrait of Alida Christina Assink" title="Jan Adam Kruseman, 1833"></div>
            <div><img src="./images/small/painting3.jpg" alt="Self-portrait" title="Vincent van Gogh, 1887"></div>
            <div><img src="./images/small/painting4.jpg" alt="William II, Prince of Orange, and his Bride, Mary Stuart" title="Anthony van Dyck, 1641"></div>
            <div><img src="./images/small/painting5.jpg" alt="Milkmaid" title="Johannes Vermeer, c. 1660"></div>
        </div>
    </main>
    
    <script>
        // 1. the 'reset' button is used to reset the image and the slider values
        $('#resetFilters').click(function(event) {
            event.preventDefault(); // prevent the default form submission behavior
            $('#imgManipulated img').css('filter', ''); // reset the image filter
            $('.sliders').each(function() { // reset all sliders to their default values
                if ($(this).attr('id') === 'sliderOpacity') {
                    $(this).val(100);
                    $('#numOpacity').text(100);
                } else if ($(this).attr('id') === 'sliderSaturation') {
                    $(this).val(100);
                    $('#numSaturation').text(100);
                } else if ($(this).attr('id') === 'sliderBrightness') {
                    $(this).val(100);
                    $('#numBrightness').text(100);
                } else if ($(this).attr('id') === 'sliderHue') {
                    $(this).val(0);
                    $('#numHue').text(0);
                } else if ($(this).attr('id') === 'sliderGray') {
                    $(this).val(0);
                    $('#numGray').text(0);
                } else if ($(this).attr('id') === 'sliderBlur') {
                    $(this).val(0);
                    $('#numBlur').text(0);
                }
            });
        });

        // 2. clicking on the thumbnail image replaces the main image in the <figure>
        $('#thumbBox img').click(function() {
            var newSrc = $(this).attr('src').replace('small', 'medium'); // get the new image source by replacing 'small' with 'medium'
            $('#imgManipulated img').attr('src', newSrc); // update the main image source
            $('#imgManipulated img').css('filter', ''); // reset the image filter when a new image is selected
            $('.sliders').each(function() { // reset all sliders to their default values
                if ($(this).attr('id') === 'sliderOpacity') {
                    $(this).val(100);
                    $('#numOpacity').text(100);
                } else if ($(this).attr('id') === 'sliderSaturation') {
                    $(this).val(100);
                    $('#numSaturation').text(100);
                } else if ($(this).attr('id') === 'sliderBrightness') {
                    $(this).val(100);
                    $('#numBrightness').text(100);
                } else if ($(this).attr('id') === 'sliderHue') {
                    $(this).val(0);
                    $('#numHue').text(0);
                } else if ($(this).attr('id') === 'sliderGray') {
                    $(this).val(0);
                    $('#numGray').text(0);
                } else if ($(this).attr('id') === 'sliderBlur') {
                    $(this).val(0);
                    $('#numBlur').text(0);
                }
            });
        });

        // 3. the alt and title attributes of the selected thumbnail will be displayed in the <figcaption>
        $('#thumbBox img').click(function() {
            var altText = $(this).attr('alt'); // get the alt text of the clicked thumbnail
            var titleText = $(this).attr('title'); // get the title text of the clicked thumbnail
            $('#imgManipulated figcaption').html('<em>' + altText + '</em><br>' + titleText); // update the figcaption with the new alt and title text
        });

        // 4. the various sliders should set the appropriate CSS filter and -webkit-filter properties whenever the user changes any of the sliders
        $('.sliders').on('input change', function() {
            var opacity = $('#sliderOpacity').val();
            var saturation = $('#sliderSaturation').val();
            var brightness = $('#sliderBrightness').val();
            var hue = $('#sliderHue').val();
            var gray = $('#sliderGray').val();
            var blur = $('#sliderBlur').val();

            var filterValue = 'opacity(' + opacity + '%) ' +
                              'saturate(' + saturation + '%) ' +
                              'brightness(' + brightness + '%) ' +
                              'hue-rotate(' + hue + 'deg) ' +
                              'grayscale(' + gray + '%) ' +
                              'blur(' + blur + 'px)';

            $('#imgManipulated img').css({
                'filter': filterValue,
                '-webkit-filter': filterValue
            });

            // Update the displayed values next to the sliders
            $('#numOpacity').text(opacity);
            $('#numSaturation').text(saturation);
            $('#numBrightness').text(brightness);
            $('#numHue').text(hue);
            $('#numGray').text(gray);
            $('#numBlur').text(blur);
        });
    </script>    
    
    </body>
</html>
